<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Karabas Barabas | Владелец кукольного театра</title>
  <meta name="description" content="Владелец кукольного театра. Жёсткий руководитель."/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f1a;
      --text: #e2e8f0;
      --accent: #6c5ce7;
      --card: #1a1a2e;
      --border: #2d2d44;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .card {
      background: var(--card);
      border-radius: 1.5rem;
      padding: 3rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      transition: transform 0.3s ease;
    }
    .card:hover { transform: translateY(-8px); }
.avatar {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid var(--accent);
  margin-bottom: 1.5rem;
  transition: all 0.3s ease;
  transform: perspective(1000px) rotateY(0deg);
  box-shadow: 0 8px 20px rgba(108, 92, 231, 0.2);
}

.avatar:hover {
  transform: perspective(1000px) rotateY(8deg) scale(1.1);
  border: 5px solid #a29bfe;
  box-shadow: 0 15px 30px rgba(108, 92, 231, 0.4);
  cursor: pointer;
}
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #a29bfe, #6c5ce7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }
    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      background: var(--border);
      color: var(--text);
      text-decoration: none;
      border-radius: 0.75rem;
      font-weight: 500;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }
    .links a:hover {
      background: var(--accent);
      color: white;
      transform: translateY(-2px);
    }
    .links a svg {
      width: 18px; height: 18px;
    }
    footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #64748b;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    
    .card {
      animation: fadeIn 0.8s ease-out;
    }
  </style>
</head>
