<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Спираль Фибоначчи — прокрутка</title>
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #000; color: #fff; font-family: 'Segoe UI', sans-serif;
    }
    .scene {
      perspective: 1000px;
      width: 100vw; height: 100vh;
      overflow-y: scroll; overflow-x: hidden;
      scroll-snap-type: y mandatory;
    }
    .card {
      position: absolute;
      width: 300px; height: 400px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5em; font-weight: bold;
      color: white;
      scroll-snap-align: center;
      transition: transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.8s;
      opacity: 0.3;
      transform: scale(0.5) rotateY(30deg);
    }
    .card.active {
      opacity: 1;
      transform: scale(1) rotateY(0deg);
      z-index: 10;
    }
    .card::before {
      content: ''; position: absolute; inset: 0;
      background: inherit; border-radius: 20px;
      filter: blur(20px); opacity: 0.4; z-index: -1;
    }
  </style>
</head>
<body>

<div class="scene" id="scene">
  <!-- Здесь будут карточки -->
</div>

<script>
  const scene = document.getElementById('scene');
  const cards = [];
  const totalCards = 12;

  // Коэффициент золотого сечения
  const phi = (1 + Math.sqrt(5)) / 2;

  // Генерация позиций по спирали Фибоначчи
  function fibSpiral(n) {
    const angle = n * 137.508 * (Math.PI / 180); // Золотой угол ≈137.5°
    const r = Math.sqrt(n) * 70; // Радиус растёт с корнем
    return { x: r * Math.cos(angle), y: r * Math.sin(angle) };
  }

  // Создаём карточки
  for (let i = 0; i < totalCards; i++) {
    const card = document.createElement('div');
    card.className = 'card';
    card.textContent = i + 1;

    // Позиция по спирали Фибоначчи
    const pos = fibSpiral(i + 1);
    const scale = 0.7 + (i / totalCards) * 0.6; // Размер растёт

    card.style.width = 250 + i * 20 + 'px';
    card.style.height = 350 + i * 20 + 'px';
    card.style.left = `calc(50% + ${pos.x}px - ${125 + i * 10}px)`;
    card.style.top = `${500 + i * 800}px`; // Вертикальное расстояние между секциями

    // Цвет по градиенту
    const hue = (i * 360 / totalCards) % 360;
    card.style.background = `linear-gradient(135deg, hsl(${hue}, 70%, 50%), hsl(${(hue+60)%360}, 70%, 40%))`;

    scene.appendChild(card);
    cards.push(card);
  }

  // Обработка прокрутки
  function updateActiveCard() {
    const scrollY = window.scrollY + window.innerHeight / 2;

    cards.forEach((card, i) => {
      const rect = card.getBoundingClientRect();
      const cardCenter = rect.top + rect.height / 2 + window.scrollY;

      if (Math.abs(scrollY - cardCenter) < window.innerHeight * 0.6) {
        card.classList.add('active');
      } else {
        card.classList.remove('active');
      }
    });
  }

  scene.addEventListener('scroll', updateActiveCard);
  window.addEventListener('resize', updateActiveCard);
  window.addEventListener('load', updateActiveCard);

  // Автопрокрутка для демонстрации (убери, если не нужно)
  let autoScroll = setInterval(() => {
    scene.scrollBy({ top: 2, behavior: 'smooth' });
    if (scene.scrollTop >= scene.scrollHeight - scene.clientHeight - 100) {
      clearInterval(autoScroll);
    }
  }, 30);
</script>

</body>
</html>
