<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Спираль Фибоначчи — настоящая раскрутка</title>
<style>
  body, html { margin:0; height:100%; background:#000; overflow:hidden; }
  #container {
    position: absolute;
    width: 200vw; height: 200vh;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(0.9);
  }
  .box {
    position: absolute;
    border: 3px solid #0f0;
    box-sizing: border-box;
    color: #0f0;
    font-family: 'Courier New', monospace;
    font-size: 3vw;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform-origin: center;
    transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    text-shadow: 0 0 20px #0f0;
    box-shadow: 0 0 30px rgba(0,255,0,0.4);
  }
  .box.visible {
    opacity: 1;
    transform: scale(1) rotate(0deg) !important;
  }
  .spiral-line {
    position: absolute;
    width: 100%; height: 100%;
    border: 2px solid #f0f;
    border-radius: 50%;
    opacity: 0.3;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="container"></div>

<script>
// Последовательность Фибоначчи
const fib = [0, 1];
while (fib[fib.length-1] < 10000) {
  fib.push(fib[fib.length-1] + fib[fib.length-2]);
}
fib.shift(); // убираем первый ноль

const container = document.getElementById('container');
const boxes = [];
let currentIndex = 0;

// Направления приклеивания: 0=вправо, 1=вверх, 2=влево, 3=вниз
const directions = [
  {dx: 1, dy: 0},  // вправо
  {dx: 0, dy:-1},  // вверх
  {dx:-1, dy: 0},  // влево
  {dx: 0, dy: 1}   // вниз
];

let x = 0, y = 0;        // текущие координаты (центр последнего квадрата)
let dirIndex = 0;        // текущее направление
let maxInDirection = 1;  // сколько квадратов в текущем направлении
let countInDirection = 0;

fib.forEach((size, i) => {
  if (i === 0) return;

  const box = document.createElement('div');
  box.className = 'box';
  box.textContent = size;

  // Размер квадрата в vw (чтобы масштабировалось)
  const side = size * 0.6; // коэффициент подбираем под экран
  box.style.width = box.style.height = side + 'vw';

  // Позиционируем по спирали
  const dir = directions[dirIndex];
  x += dir.dx * fib[i-1] * 0.6;
  y += dir.dy * fib[i-1] * 0.6;

  box.style.left = (50 + x) + 'vw';
  box.style.top  = (50 + y) + 'vw';

  // Поворот квадрата в зависимости от направления
  box.style.transform = `rotate(${dirIndex * 90}deg) scale(0.3)`;

  container.appendChild(box);
  boxes.push(box);

  // Управление сменой направления (как в настоящей спирали Фибоначчи)
  countInDirection++;
  if (countInDirection === maxInDirection) {
    countInDirection = 0;
    dirIndex = (dirIndex + 1) % 4;
    if (dirIndex === 2 || dirIndex === 0) maxInDirection++;
  }
});

// Показываем квадраты по одному при прокрутке
function update() {
  boxes.forEach((box, i) => {
    if (i < currentIndex) {
      box.classList.add('visible');
    } else {
      box.classList.remove('visible');
    }
  });
}

// Прокрутка колесом мыши
window.addEventListener('wheel', e => {
  if (e.deltaY > 0 && currentIndex < boxes.length) {
    currentIndex++;
  } else if (e.deltaY < 0 && currentIndex > 1) {
    currentIndex--;
  }
  update();
});

// Также поддержка клавиш ← →
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && currentIndex < boxes.length) currentIndex++;
  if (e.key === 'ArrowLeft' && currentIndex > 1) currentIndex--;
  update();
});

// Автоматическая раскрутка при загрузке (можно убрать)
let auto = setInterval(() => {
  if (currentIndex < boxes.length) {
    currentIndex++;
    update();
  } else {
    clearInterval(auto);
  }
}, 800);

update();
</script>
</body>
</html>
